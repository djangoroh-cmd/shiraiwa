<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卓球ゲーム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>卓球ゲーム</h1>

    <div class="hud">
      <div class="score">
        <span class="label">あなた</span>
        <span id="playerScore">0</span>
      </div>
      <div class="mid">
        <span id="statusText">スペースキーでスタート</span>
      </div>
      <div class="score">
        <span class="label">CPU</span>
        <span id="cpuScore">0</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="800" height="500"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">卓球ゲーム</h2>
          <p id="overlayText">↑ / ↓、マウス移動、またはマウスホイールでパドルを操作。<br>5点先取で勝利。</p>
          <div class="difficulty">
            <label>難易度:
              <select id="difficulty">
                <option value="easy">かんたん</option>
                <option value="normal" selected>ふつう</option>
                <option value="hard">むずかしい</option>
              </select>
            </label>
          </div>
          <button id="startBtn">スタート (Space)</button>
        </div>
      </div>
    </div>

    <p class="hint">操作: ↑ / ↓ キー、W / S キー、マウス移動、またはマウスホイール。P で一時停止。</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
